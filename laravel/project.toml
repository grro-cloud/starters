# Buildpack settings for Grro (Paketo PHP on the FULL builder).
# Composer installs dependencies (no dev packages) and enables the PHP extensions
# listed as ext-* in composer.json. nginx serves public/ and passes PHP to php-fpm.
[_]
schema-version = "0.2"

[[io.buildpacks.build.env]]
name = "BP_PHP_SERVER"
value = "nginx"

[[io.buildpacks.build.env]]
name = "BP_PHP_WEB_DIR"
value = "public"

# Grro can run the app as any user id. The buildpack's generated nginx config is only
# readable by the build user's group, so the Procfile starts php-fpm and nginx with the
# configs in deploy/ instead. This setting turns off the buildpack's startup step that
# rewrites its own nginx.conf (it does nothing when the file does not exist).
[[io.buildpacks.build.env]]
name = "BPE_OVERRIDE_EXECD_CONF"
value = "/tmp/nginx.conf"
