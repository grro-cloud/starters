; php-fpm config for Grro. deploy/start.sh fills in __RUN__ and writes the result to /tmp.
[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no
pid = __RUN__/php-fpm.pid

[www]
listen = __RUN__/php-fpm.sock
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Pass the container environment (APP_KEY, DATABASE_URL, ...) to PHP.
clear_env = no
; Send what PHP and Laravel write to stderr to the container log.
catch_workers_output = yes
decorate_workers_output = no
