# nginx config for Grro. deploy/start.sh fills in __PORT__, __APP__ and __RUN__
# and writes the result to /tmp, so nothing in the app folder has to be writable.
worker_processes auto;
daemon off;
error_log stderr;
pid __RUN__/nginx.pid;

events {
    worker_connections 1024;
}

http {
    types {
        text/html html htm;
        text/css css;
        text/plain txt;
        text/xml xml;
        application/javascript js mjs;
        application/json json map;
        application/manifest+json webmanifest;
        application/pdf pdf;
        application/wasm wasm;
        image/gif gif;
        image/jpeg jpeg jpg;
        image/png png;
        image/svg+xml svg svgz;
        image/webp webp;
        image/avif avif;
        image/x-icon ico;
        font/woff woff;
        font/woff2 woff2;
        font/ttf ttf;
    }
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css text/plain text/xml application/javascript application/json image/svg+xml;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 32m;
    access_log /dev/stdout;

    client_body_temp_path __RUN__/client_body;
    proxy_temp_path __RUN__/proxy;
    fastcgi_temp_path __RUN__/fastcgi;

    server {
        listen __PORT__ default_server;
        root __APP__/public;
        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt { access_log off; log_not_found off; }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass unix:__RUN__/php-fpm.sock;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_hide_header X-Powered-By;

            fastcgi_param SCRIPT_FILENAME   $realpath_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME       $fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT     $realpath_root;
            fastcgi_param DOCUMENT_URI      $document_uri;
            fastcgi_param PATH_INFO         $fastcgi_path_info;
            fastcgi_param QUERY_STRING      $query_string;
            fastcgi_param REQUEST_METHOD    $request_method;
            fastcgi_param CONTENT_TYPE      $content_type;
            fastcgi_param CONTENT_LENGTH    $content_length;
            fastcgi_param REQUEST_URI       $request_uri;
            fastcgi_param REQUEST_SCHEME    $scheme;
            fastcgi_param SERVER_PROTOCOL   $server_protocol;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE   nginx;
            fastcgi_param REMOTE_ADDR       $remote_addr;
            fastcgi_param REMOTE_PORT       $remote_port;
            fastcgi_param SERVER_ADDR       $server_addr;
            fastcgi_param SERVER_PORT       $server_port;
            fastcgi_param SERVER_NAME       $host;
            fastcgi_param REDIRECT_STATUS   200;
            fastcgi_param HTTP_PROXY        "";
        }

        location ~ \.php$ {
            return 404;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
