# Buildpack settings for Grro (Paketo Node.js on the base builder).
# Node.js version comes from "engines" in package.json. At build time the "build"
# script compiles TypeScript to dist/, then "npm start" runs it.
[_]
schema-version = "0.2"

[[io.buildpacks.build.env]]
name = "BP_NODE_RUN_SCRIPTS"
value = "build"
