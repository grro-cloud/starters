spring.application.name=grro-spring-boot-starter

# Listen on 0.0.0.0:$PORT (Grro sets PORT; 8080 when it is not set).
server.address=0.0.0.0
server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework

# Serve the actuator health endpoint at /healthz and nothing else from actuator.
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=healthz
management.endpoints.web.exposure.include=health

spring.main.banner-mode=off
