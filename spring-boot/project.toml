# Buildpack settings for Grro (Paketo Java on the base builder).
# The buildpack runs ./mvnw package and starts the Spring Boot jar.
[_]
schema-version = "0.2"

[[io.buildpacks.build.env]]
name = "BP_JVM_VERSION"
value = "21"

[[io.buildpacks.build.env]]
name = "BP_MAVEN_BUILD_ARGUMENTS"
value = "-Dmaven.test.skip=true --no-transfer-progress package"
