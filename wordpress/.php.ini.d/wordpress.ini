; Extensions WordPress uses (database, HTTPS requests, images, text).
; The PHP buildpack ships them but leaves them off.
extension = mysqli.so
extension = curl.so
extension = openssl.so
extension = mbstring.so
extension = gd.so
extension = exif.so
extension = fileinfo.so
extension = intl.so

upload_max_filesize = 32M
post_max_size = 32M
memory_limit = 256M
expose_php = Off

; Errors go to the app log in Grro, never onto the page.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
