# Buildpack settings for Grro (Paketo Node.js on the base builder).
# "next build" runs at build time, then "npm start" runs "next start" on $PORT.
[_]
schema-version = "0.2"

[[io.buildpacks.build.env]]
name = "BP_NODE_RUN_SCRIPTS"
value = "build"

[[io.buildpacks.build.env]]
name = "NEXT_TELEMETRY_DISABLED"
value = "1"
